name: tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Python test dependencies
        working-directory: m3u8
        run: python -m pip install --upgrade pip httpx pytest
      - name: Run tests
        working-directory: m3u8
        run: python -m unittest discover -s tests -v

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check extension scripts
        run: |
          node --check m3u8-sniffer-extension/background.js
          node --check m3u8-sniffer-extension/content.js
          node --check m3u8-sniffer-extension/popup.js
          node --check m3u8-sniffer-extension/offscreen.js
          python -m json.tool m3u8-sniffer-extension/manifest.json > /dev/null
          node --check extension/background.js
          node --check extension/content.js
          node --check extension/popup.js
          python -m json.tool extension/manifest.json > /dev/null

  automatic-pipeline:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, macos-15-intel, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install automatic pipeline dependencies
        run: python -m pip install -r requirements.txt
      - name: Install test browser
        run: python -m playwright install chromium
      - name: Exercise native installer and host on macOS and Linux
        if: runner.os != 'Windows'
        run: |
          python -m venv --system-site-packages .venv
          sh setup.sh
          .venv/bin/python scripts/check_platform.py
      - name: Test capture, native messages, resume, and exports
        run: python -m unittest discover -s tests -v
      - name: Install the Windows ZIP with a private Python
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          python scripts/build_windows_zip.py
          Expand-Archive -LiteralPath dist/Lecture-Script-Windows-0.5.1.zip -DestinationPath 'work/windows zip'
          $lectureInstall = Join-Path $env:RUNNER_TEMP 'Lecture Script installed'
          & '.\work\windows zip\Lecture-Script-Windows\install-windows.ps1' -InstallDir $lectureInstall -NoOpen
          $env:PYTHONUTF8 = '1'
          & (Join-Path $lectureInstall '.venv\Scripts\python.exe') scripts/check_platform.py $lectureInstall
          if ($LASTEXITCODE -ne 0) { throw 'Installed Windows application smoke test failed.' }
      - name: Save Windows share ZIP
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Lecture-Script-Windows
          path: dist/Lecture-Script-Windows-0.5.1.zip
