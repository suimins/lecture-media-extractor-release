[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "m3u8-transcript-app"
version = "0.1.0"
description = "CLI HLS lecture subtitle/audio transcription pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "faster-whisper>=1.0",
]

[project.scripts]
m3u8-transcript = "app.main:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
